name: Publish gateway image

# Builds MemoryCore/Dockerfile (the tdai-gateway L0/L1/L2 pipeline) and pushes
# it to Docker Hub as chauit/tencentdb-agent-memory. distributed-agent-mesh pins
# the resulting digest in stacks/agent-state-memory.yml, so the job prints the
# digest in the step summary for copy-paste.
#
# Required repository secrets (same names as distributed-agent-mesh):
#   DOCKERHUB_USERNAME - Docker Hub account that owns the image
#   DOCKERHUB_TOKEN    - Docker Hub access token (not the account password)
#
# Trigger: push a `v*` tag, or run it by hand. Fork tags carry a `-mesh.N`
# suffix (see docs/mesh-fork-notes.md); upstream release tags synced into the
# fork must never publish an image, so the guard step refuses any other name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish alongside the defaults
        required: false
        type: string
      platforms:
        description: Target platforms (native deps compile per arch; arm64 under QEMU is slow)
        required: false
        default: linux/amd64
        type: string

env:
  IMAGE: chauit/tencentdb-agent-memory

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish MemoryCore image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fail early without credentials
        # Without this the build runs for minutes and only fails at push time.
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set as repository secrets."
            exit 1
          fi

      - name: Refuse non-fork tags
        # `v*` also matches upstream tags (v2.0.1, v2.0.2-beta.1) if they are
        # ever pushed to the fork. Only `-mesh.N` tags describe this image.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "${{ github.ref_name }}" in
            v*-mesh.*) echo "Publishing fork tag ${{ github.ref_name }}" ;;
            *) echo "::error::Tag ${{ github.ref_name }} is not a fork tag (expected v<upstream>-mesh.<n>); refusing to publish."; exit 1 ;;
          esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: MemoryCore
          file: MemoryCore/Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published ${IMAGE}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Pin in distributed-agent-mesh/stacks/agent-state-memory.yml as ${IMAGE}@${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
